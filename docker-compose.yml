services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ats_user
      POSTGRES_PASSWORD: ats_password
      POSTGRES_DB: ats_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ats_user -d ats_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
      
  api:
    build: 
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://ats_user:ats_password@db:5432/ats_db
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=production_secret_key_change_me
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build: 
      context: .
      dockerfile: Dockerfile.celery
    environment:
      - DATABASE_URL=postgresql+asyncpg://ats_user:ats_password@db:5432/ats_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
        
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:8000
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  postgres_data:
