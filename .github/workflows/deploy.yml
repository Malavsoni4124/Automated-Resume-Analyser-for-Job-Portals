name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  # ─────────────────────────
  #  Backend Tests
  # ─────────────────────────
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install System Dependencies
        run: sudo apt-get update && sudo apt-get install -y libpq-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m spacy download en_core_web_md

      - name: Run Pytest
        env:
          PYTHONPATH: .
          DATABASE_URL: "sqlite+aiosqlite:///./test_ats.db"
          JWT_SECRET: "test_secret_key_for_ci"
          REDIS_URL: "redis://localhost:6379/0"
        run: |
          pytest tests/ -v --tb=short

  # ─────────────────────────
  #  Frontend Lint + Build
  # ─────────────────────────
  test-frontend:
    name: Frontend Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm install

      - name: Type-check & Build
        working-directory: frontend
        env:
          VITE_API_URL: https://api.example.com
        run: npm run build

  # ─────────────────────────
  #  Docker Build + Deploy
  # ─────────────────────────
  deploy:
    name: Build & Deploy
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Images
        run: docker compose build

      # ── Uncomment and configure to deploy ──
      # - name: Login to Container Registry
      #   uses: docker/login-action@v3
      #   with:
      #     registry: ghcr.io
      #     username: ${{ github.actor }}
      #     password: ${{ secrets.GITHUB_TOKEN }}

      # - name: Push & Deploy to Render / Railway / Fly.io
      #   env:
      #     DEPLOY_HOOK: ${{ secrets.DEPLOY_HOOK_URL }}
      #   run: curl -X POST "$DEPLOY_HOOK"

      - name: Deploy Summary
        run: |
          echo "✅ All tests passed. Docker images built."
          echo "   Configure secrets + deployment hook to enable auto-deploy."
